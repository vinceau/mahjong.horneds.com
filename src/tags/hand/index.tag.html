<hand>
    <div class="u-flex mj-hand">
        <div>
            <div class="u-flex u-mb1">
                <span class="u-bold"> HAND #{ opts.number } </span>
            </div>
            <div class="u-gray-l u-mb1 u-size-s">1. Review the winning hand</div>
            <div class="u-flex u-flex--wrap">
                <tile each={ tile in concealed() } if={ tile.id != opts.hand.wait.id } tile={ tile } label={ descTiles[tile.tile] } />
                <div each={ set in called() } class="u-flex mj-hand__called">
                    <tile each={ tile in set.tiles } open={ set.isOpened && tile.id === set.tiles[set.tiles.length - 1].id } back={ isKanBack(tile) } tile={ tile } label={ descTiles[tile.tile] } />
                </div>
            </div>
        </div>
        <div>
            <span class="u-mla u-center" style="width: 70px">
                { opts.hand.tsumo && 'TSUMO' || 'RON' }
            </span>
            <tile tile={ opts.hand.wait } open={ !opts.hand.tsumo } label={ descTiles[opts.hand.wait.tile] }/>
        </div>
    </div>
    <script type="text/ts">
        require('tags/tile')

        require('./styles.sass')

        this.descTiles = require('utils/tiles').desc

        // the concealed sets and the pair stay in the hand; called sets and kans
        // are laid out on the right, the winning tile is drawn separately
        this.concealed = () => opts.hand.tiles().filter((tile) => !tile.set.isOpened && !tile.set.isKan)
        this.called = () => opts.hand.sets.filter((set) => set.isOpened || set.isKan)

        // a closed kan shows its two outer tiles face down: BFFB
        this.isKanBack = (tile) => {
            const set = tile.set
            return !!set && set.isKan && !set.isOpened &&
                (tile.id === set.tiles[0].id || tile.id === set.tiles[set.tiles.length - 1].id)
        }
    </script>
</hand>
